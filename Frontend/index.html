<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Freeapps Uploader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-wrapper">
      <div class="hero-glow glow-1"></div>
      <div class="hero-glow glow-2"></div>
      <div class="hero-glow glow-3"></div>

      <header class="site-header">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#818cf8" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
            <path
              d="M32 8L8 20l24 12 24-12L32 8z"
              fill="url(#logoGrad)"
              opacity="0.9"
            />
            <path
              d="M8 32l24 12 24-12"
              stroke="url(#logoGrad)"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <path
              d="M8 44l24 12 24-12"
              stroke="url(#logoGrad)"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
          <span data-i18n="appName">Freeapps Uploader</span>
        </div>

        <div class="header-controls">
          <button class="icon-btn" id="langToggle" title="Toggle language">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path d="M2 12h20" stroke="currentColor" stroke-width="1.5" />
              <path
                d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
            <span class="lang-label" id="langLabel">EN</span>
          </button>
          <button class="icon-btn" id="themeToggle" title="Toggle theme">
            <svg
              class="sun-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                cx="12"
                cy="12"
                r="5"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <svg
              class="moon-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              style="display: none"
            >
              <path
                d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="main">
        <div class="container" id="uploadContainer">
          <div class="card-header">
            <h2 data-i18n="uploadTitle">Upload a file</h2>
            <p class="subtitle" data-i18n="uploadSubtitle">
              Encrypted, fast, and free
            </p>
          </div>

          <div class="drop-zone" id="dropZone">
            <input type="file" id="uploadFile" hidden />
            <div class="drop-zone-content">
              <svg
                class="drop-icon"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <polyline
                  points="17,8 12,3 7,8"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <line
                  x1="12"
                  y1="3"
                  x2="12"
                  y2="15"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="drop-text"
                ><span data-i18n="dropText1">Drag & drop or</span>
                <span class="browse-link" data-i18n="browse">browse</span></span
              >
              <span class="drop-hint" data-i18n="dropHint"
                >Any file type supported</span
              >
            </div>
            <div
              class="drop-zone-selected"
              id="dropZoneSelected"
              style="display: none"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path
                  d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                  stroke="#818cf8"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <polyline
                  points="14,2 14,8 20,8"
                  stroke="#818cf8"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span id="selectedFileName"></span>
              <button
                class="remove-file-btn"
                id="removeFileBtn"
                type="button"
                title="Remove"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <line
                    x1="18"
                    y1="6"
                    x2="6"
                    y2="18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <line
                    x1="6"
                    y1="6"
                    x2="18"
                    y2="18"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="options-grid">
            <div class="field">
              <label for="passwordUpload">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <rect
                    x="3"
                    y="11"
                    width="18"
                    height="11"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                  <path
                    d="M7 11V7a5 5 0 0110 0v4"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
                <span data-i18n="passwordLabel">Password</span>
              </label>
              <input
                type="password"
                id="passwordUpload"
                data-i18n-placeholder="passwordPlaceholder"
                placeholder="Optional"
              />
            </div>
            <div class="field">
              <label for="expireHours">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                  <circle
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />
                  <polyline
                    points="12,6 12,12 16,14"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
                <span data-i18n="expiresLabel">Expires in</span>
              </label>
              <input
                type="number"
                id="expireHours"
                data-i18n-placeholder="expiresPlaceholder"
                placeholder="1 - 7 days"
                min="1"
                max="7"
              />
            </div>
          </div>

          <button id="uploadBtn" class="btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path
                d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <polyline
                points="17,8 12,3 7,8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                x1="12"
                y1="3"
                x2="12"
                y2="15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span data-i18n="uploadBtn">Upload</span>
          </button>

          <div
            class="progress-section"
            id="progressSection"
            style="display: none"
          >
            <div class="progress-track">
              <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="progress-meta">
              <span id="speedDisplay">0 KB/s</span>
              <span id="progressPercent">0%</span>
              <span id="timeDisplay">--:--</span>
            </div>
          </div>

          <div
            class="storage-widget"
            id="storageBarContainer"
            style="display: none"
          >
            <div class="storage-header">
              <span data-i18n="storage">Storage</span>
              <span id="storageText">Loading...</span>
            </div>
            <div class="storage-track">
              <div class="storage-fill" id="storageProgressBar"></div>
            </div>
          </div>

          <p id="status"></p>
        </div>

        <footer class="site-footer">
          <span data-i18n="madeBy">Made by</span>
          <a href="https://github.com/psycho1767" target="_blank">psycho1767</a>
        </footer>
      </main>
    </div>

    <div class="result" id="result"></div>

    <script src="./app.js"></script>
  </body>
</html>
